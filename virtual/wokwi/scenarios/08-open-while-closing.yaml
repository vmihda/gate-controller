# OPEN while closing (closing started by the wall button): stop pulse, then open pulse.
# If the gate is less than about a second from the open limit, it gets there before OPENING is
# recognized and the command ends with UNEXPECTED_STOP (see the Task 7 report); this scenario
# lets the gate close for a few seconds first.
name: open while closing
version: 1
author: gate-controller
steps:
  - name: device ready, gate closed
    wait-serial: 'gate> '
  - write-serial: "status\n"
  - wait-serial: 'gate: state=CLOSED busy=0 error=NONE'

  - name: setup, open fully
    write-serial: "open\n"
  - wait-serial: 'gate: state=NOT_CLOSED busy=0 error=NONE'
  - name: setup, wall button starts closing
    set-control: { part-id: wall, name: pressed, value: 1 }
  - delay: 300ms
  - set-control: { part-id: wall, name: pressed, value: 0 }
  - wait-serial: 'gate: state=CLOSING busy=0 error=NONE'
  - name: let it close a while, so the reopening is long enough to be recognized
    delay: 3000ms

  - name: open
    write-serial: "open\n"
  - wait-serial: 'gate: state=OPENING busy=1 error=NONE'
  - wait-serial: 'gate: state=NOT_CLOSED busy=0 error=NONE'
  - expect-pin: { part-id: nice, name: OPEN, value: 1 }
