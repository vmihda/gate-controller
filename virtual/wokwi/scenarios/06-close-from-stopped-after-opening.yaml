# CLOSE from stopped midway after opening: one pulse closes the gate.
name: close from stopped midway after opening
version: 1
author: gate-controller
steps:
  - name: device ready, gate closed
    wait-serial: 'gate> '
  - write-serial: "status\n"
  - wait-serial: 'gate: state=CLOSED busy=0 error=NONE'

  - name: setup, wall button starts opening
    set-control: { part-id: wall, name: pressed, value: 1 }
  - delay: 300ms
  - set-control: { part-id: wall, name: pressed, value: 0 }
  - wait-serial: 'gate: state=OPENING busy=0 error=NONE'
  - delay: 3000ms
  - name: setup, wall button stops it midway
    set-control: { part-id: wall, name: pressed, value: 1 }
  - delay: 300ms
  - set-control: { part-id: wall, name: pressed, value: 0 }
  - wait-serial: 'gate: state=NOT_CLOSED busy=0 error=NONE'
  - expect-pin: { part-id: nice, name: OPEN, value: 0 }

  - name: close
    write-serial: "close\n"
  - wait-serial: 'gate: state=CLOSING busy=1 error=NONE'
  - wait-serial: 'gate: state=CLOSED busy=0 error=NONE'
  - expect-pin: { part-id: nice, name: CLOSED, value: 1 }
