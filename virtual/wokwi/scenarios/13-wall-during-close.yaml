# Wall button stops the gate while CLOSE runs: the command ends with UNEXPECTED_STOP and sends
# no more pulses.
name: wall button during close
version: 1
author: gate-controller
steps:
  - name: device ready, gate closed
    wait-serial: 'gate> '
  - write-serial: "status\n"
  - wait-serial: 'gate: state=CLOSED busy=0 error=NONE'

  - name: setup, open fully
    write-serial: "open\n"
  - wait-serial: 'gate: state=NOT_CLOSED busy=0 error=NONE'

  - name: close
    write-serial: "close\n"
  - wait-serial: 'gate: state=CLOSING busy=1 error=NONE'
  - delay: 2000ms
  - name: wall button stops the gate
    set-control: { part-id: wall, name: pressed, value: 1 }
  - delay: 300ms
  - set-control: { part-id: wall, name: pressed, value: 0 }
  - wait-serial: 'gate: state=NOT_CLOSED busy=0 error=UNEXPECTED_STOP'
  - name: a pulse would have moved the gate by now
    delay: 3000ms
  - write-serial: "status\n"
  - wait-serial: 'gate: state=NOT_CLOSED busy=0 error=UNEXPECTED_STOP'
  - expect-pin: { part-id: nice, name: OPEN, value: 0 }
  - expect-pin: { part-id: nice, name: CLOSED, value: 0 }
